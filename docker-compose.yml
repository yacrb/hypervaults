services:
  nginx:
    image: nginx:1.29-alpine
    # Custom entrypoint generates the Mailpit htpasswd file then starts nginx.
    # The secure config does not reference the htpasswd file; the challenge config does.
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ${NGINX_CONFIG_FILE:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/entrypoint.sh:/nginx-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY in .env}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    environment:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:?Set NEXT_PUBLIC_TURNSTILE_SITE_KEY in .env}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:?Set JWT_ALGORITHM in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:?Set ACCESS_TOKEN_EXPIRE_MINUTES in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Set MINIO_ENDPOINT in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_PRESIGNED_PUBLIC_BASE_URL: ${MINIO_PRESIGNED_PUBLIC_BASE_URL:?Set MINIO_PRESIGNED_PUBLIC_BASE_URL in .env}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY in .env}
      TURNSTILE_DEV_BYPASS: ${TURNSTILE_DEV_BYPASS:?Set TURNSTILE_DEV_BYPASS in .env}
      CHALLENGE_MODE: ${CHALLENGE_MODE:-false}
      ENABLE_X_FORWARDED_DOCS_BYPASS: ${ENABLE_X_FORWARDED_DOCS_BYPASS:-false}
      # Second challenge branch flags
      ENABLE_TRACE_MAIL_DIAGNOSTICS: ${ENABLE_TRACE_MAIL_DIAGNOSTICS:-false}
      ENABLE_MAILPIT_EXPOSURE: ${ENABLE_MAILPIT_EXPOSURE:-false}
      # Mailpit SMTP settings — backend sends staging emails through Mailpit only
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-HyperVaults Dev <no-reply@hypervaults.local>}
      MAILPIT_UI_PUBLIC_URL: ${MAILPIT_UI_PUBLIC_URL:-http://localhost/mailpit}
      # INTENTIONAL CHALLENGE VULNERABILITY: credentials are intentionally weak and
      # are leaked by TRACE /api/diagnostics/mail when the challenge is enabled.
      MAILPIT_BASIC_USER: ${MAILPIT_BASIC_USER:-devmail}
      MAILPIT_BASIC_PASSWORD: ${MAILPIT_BASIC_PASSWORD:-devmail2026}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18+ expects the volume at the parent directory so it can create
      # a major-version-specific data directory internally.
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose:
      - "9000"
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
    volumes:
      - ./minio/init/create-bucket.sh:/init/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    restart: "no"

  # Mailpit: local SMTP catcher for development and staging emails.
  # SMTP is internal only (port 1025 not published to host).
  # Web UI is internal only in secure mode; exposed through Nginx at /mailpit/
  # only when NGINX_CONFIG_FILE=./nginx/nginx.conf.challenge and
  # ENABLE_MAILPIT_EXPOSURE=true.
  mailpit:
    image: axllent/mailpit:latest
    environment:
      # Set the web root so Mailpit serves its UI from /mailpit/ when proxied.
      # INTENTIONAL CHALLENGE VULNERABILITY: Mailpit is a dev mail catcher that
      # should never be accessible from the public internet in production.
      MP_WEBROOT: /mailpit/
    expose:
      - "1025"
      - "8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/mailpit/api/v1/info >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-18-data:
  minio-data:
