events {
    worker_connections 1024;
}

http {
    upstream frontend_app {
        server frontend:3000;
    }

    upstream backend_app {
        server backend:8000;
    }

    upstream minio_api {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 12m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;

        # TRACE is blocked in secure mode. The challenge config removes this block
        # to allow TRACE requests to reach /api/diagnostics/mail.
        if ($request_method = TRACE) {
            return 405;
        }

        # Keep FastAPI's interactive documentation unreachable through the public proxy.
        location = /api/docs {
            return 404;
        }

        location = /api/redoc {
            return 404;
        }

        location = /api/openapi.json {
            return 404;
        }

        # Mailpit web UI is not exposed in secure mode.
        location /mailpit {
            return 404;
        }

        # All application API calls go to FastAPI with the original /api path preserved.
        location /api/ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Presigned object downloads use private MinIO URLs issued only after API ownership checks.
        # Only GET and HEAD are allowed here; the MinIO console is never proxied.
        location /minio/ {
            limit_except GET HEAD {
                deny all;
            }

            rewrite ^/minio/(.*)$ /$1 break;
            proxy_pass http://minio_api;
            proxy_http_version 1.1;
            proxy_set_header Host minio:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The Next.js frontend owns all non-API browser routes.
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
